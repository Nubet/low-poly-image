name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Package Windows
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure MSVC linker for Rust
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvcTools = Get-ChildItem (Join-Path $vsPath 'VC/Tools/MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $linker = Join-Path $msvcTools.FullName 'bin/Hostx64/x64/link.exe'
          if (-not (Test-Path $linker)) {
            throw "MSVC linker was not found at $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DLOWPOLY_BUILD_GUI=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/lowpoly_gui.exe package/lowpoly_gui.exe
          Copy-Item build/lowpoly.exe package/lowpoly.exe
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package/* -DestinationPath lowpoly-image-generator-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lowpoly-image-generator-windows-x86_64
          path: lowpoly-image-generator-windows-x86_64.zip

  linux:
    name: Package Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOWPOLY_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Create AppImage metadata
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/scalable/apps
          cp packaging/lowpoly.desktop AppDir/lowpoly.desktop
          cp packaging/lowpoly.svg AppDir/usr/share/icons/hicolor/scalable/apps/lowpoly.svg
          cp build/lowpoly_gui AppDir/usr/bin/lowpoly_gui
          cp build/lowpoly AppDir/usr/bin/lowpoly
          cp README.md AppDir/README.md
          cp LICENSE AppDir/LICENSE

      - name: Build AppImage
        run: |
          curl -L --fail --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/lowpoly_gui \
            --desktop-file AppDir/lowpoly.desktop \
            --output appimage
          appimage=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy.AppImage' -print -quit)
          test -n "$appimage"
          mv "$appimage" lowpoly-image-generator-linux-x86_64.AppImage
          chmod +x lowpoly-image-generator-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lowpoly-image-generator-linux-x86_64
          path: lowpoly-image-generator-linux-x86_64.AppImage

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-24.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: lowpoly-image-generator-windows-x86_64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: lowpoly-image-generator-linux-x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.zip *.AppImage --generate-notes --repo "${GITHUB_REPOSITORY}"
